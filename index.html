<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEGAT ARHITEKTURA</title>
  <meta name="description" content="LEGAT ARHITEKTURA — sajt je u izgradnji. Useljavamo uskoro!">

  <meta property="og:type" content="website">
  <meta property="og:title" content="LEGAT ARHITEKTURA">
  <meta property="og:description" content="Sajt u izgradnji. Useljavamo uskoro!">
  <meta property="og:url" content="https://legat.ba/">
  <meta property="og:image" content="https://legat.ba/og-image.jpg">
  <meta property="og:image:secure_url" content="https://legat.ba/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="bs_BA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LEGAT ARHITEKTURA">
  <meta name="twitter:description" content="Sajt u izgradnji. Useljavamo uskoro!">
  <meta name="twitter:image" content="https://legat.ba/og-image.jpg">
  <style>
    :root{
      --text:#ffffff;
      --ribbon:rgba(20,24,23,.70);
      --overlay:rgba(18,24,21,.22);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#111;
      color:var(--text);
      overflow:hidden;
    }
    .hero{
      position:relative;
      min-height:100svh;
      display:grid;
      place-items:center;
      overflow:hidden;
      isolation:isolate;
      background:#111;
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:-4%;
      z-index:0;
      background:
        linear-gradient(var(--overlay),var(--overlay)),
        url("render.jpg") center center / cover no-repeat;
      filter:blur(11px);
      transform:scale(1.08);
    }
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      background:
        linear-gradient(to bottom, rgba(255,255,255,.04), rgba(0,0,0,.10)),
        linear-gradient(to right, rgba(255,255,255,.02), rgba(255,255,255,.01));
      pointer-events:none;
    }
    .content{
      position:relative;
      z-index:2;
      text-align:center;
      width:min(92vw,980px);
      padding:36px 24px 130px;
    }
    .logo{
      width:min(420px,65vw);
      max-height:250px;
      object-fit:contain;
      display:block;
      margin:0 auto 24px;
      filter:drop-shadow(0 5px 20px rgba(0,0,0,.28));
    }
    .status{
      margin:72px 0 0;
      font-size:clamp(15px,1.35vw,20px);
      line-height:1.25;
      letter-spacing:.045em;
      font-weight:400;
      text-shadow:0 2px 16px rgba(0,0,0,.34);
      white-space:nowrap;
    }
    .status strong{
      font-weight:600;
    }
    .ribbon{
      position:absolute;
      z-index:3;
      left:0; right:0; bottom:0;
      min-height:82px;
      padding:16px 28px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--ribbon);
      border-top:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    .contact{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      gap:8px 16px;
      font-size:clamp(12px,1.05vw,15px);
      line-height:1.5;
      text-align:center;
      letter-spacing:.018em;
    }
    .contact strong{
      letter-spacing:.07em;
      font-weight:700;
    }
    .contact a{
      color:inherit;
      text-decoration:none;
    }
    .contact a:hover{
      text-decoration:underline;
      text-underline-offset:3px;
    }
    .sep{opacity:.42}
    @media (max-width:760px){
      body{overflow:auto}
      .content{
        padding-bottom:205px;
      }
      .logo{
        width:min(320px,74vw);
        margin-bottom:18px;
      }
      .ribbon{
        padding:16px 20px 18px;
      }
      .contact{
        display:block;
        font-size:13px;
      }
      .contact strong,
      .contact span,
      .contact a{
        display:block;
        margin:3px 0;
      }
      .sep{display:none!important}
    }
  </style>
</head>
<body>
  <main class="hero">
    <section class="content">
      <img class="logo" src="logo-white.png" alt="LEGAT ARHITEKTURA">
      <p class="status">Sajt u izgradnji. <strong>Useljavamo uskoro!</strong></p>
    </section>

    <footer class="ribbon">
      <div class="contact">
        <strong>LEGAT ARHITEKTURA d.o.o.</strong>
        <span class="sep">•</span>
        <span>Miloša Dujića 59a, Banja Luka</span>
        <span class="sep">•</span>
        <a href="tel:+38765396632">tel./Viber/WhatsApp +387 65 396 632</a>
        <span class="sep">•</span>
        <a href="mailto:legatarhitektura@gmail.com">legatarhitektura@gmail.com</a>
      </div>
    </footer>
  </main>
</body>
</html>
